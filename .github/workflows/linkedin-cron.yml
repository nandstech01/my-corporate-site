name: LinkedIn Cron Jobs

on:
  # 2026-06-29 再開: トークン更新済み。1日1回投稿(実時刻はジッターで変動=スパム対策)。
  schedule:
    - cron: '23 23 * * *'    # JST 8:23 LinkedIn auto-post (1日1回・実時刻はジッターで0-18分変動)
    - cron: '0 22 * * *'     # JST 7:00 LinkedIn source collector (1日1回・学習ループ用)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - linkedin-auto-post
          - linkedin-source-collector

jobs:
  run:
    # Mac self-hosted runner for `claude -p` subscription auth.
    # Roll back: change to `ubuntu-latest` and ensure ANTHROPIC_API_KEY in Secrets.
    runs-on: [self-hosted, macOS, ARM64, nands-cortex]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Setup Python 3.11 (self-hosted Mac compatible)
        # actions/setup-python@v5 hardcodes /Users/runner/hostedtoolcache and
        # can't write there on this Mac. Use the Homebrew-installed Python 3.11.
        run: |
          if ! command -v python3.11 >/dev/null 2>&1; then
            brew install python@3.11
          fi
          PYTHON_BIN=$(command -v python3.11)
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
          "$PYTHON_BIN" --version
      - name: Install Python ML dependencies
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -r services/linkedin-ml/requirements.txt -r services/x-ml/requirements.txt
          "$PYTHON_BIN" -c "import xgboost, sklearn, fugashi; print('ML dependencies OK')"
      - name: Anti-spam jitter (auto-post only; varies the actual post minute by 0-18min)
        run: |
          if [ "${{ github.event.schedule }}" = '23 23 * * *' ]; then
            D=$(( RANDOM % 1080 )); echo "post jitter ${D}s"; sleep "$D"
          fi
      - run: npx tsx scripts/slack-bot-cron.ts
        env:
          CRON_JOB: ${{ github.event.inputs.job || 'auto' }}
          CRON_SCHEDULE: ${{ github.event.schedule || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_ALLOWED_USER_IDS: ${{ secrets.SLACK_ALLOWED_USER_IDS }}
          SLACK_DEFAULT_CHANNEL: ${{ secrets.SLACK_DEFAULT_CHANNEL }}
          SLACK_GENERAL_CHANNEL_ID: ${{ secrets.SLACK_GENERAL_CHANNEL_ID }}
          AI_JUDGE_ENABLED: ${{ secrets.AI_JUDGE_ENABLED }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_USE_PLAYWRIGHT: ${{ secrets.TWITTER_USE_PLAYWRIGHT }}
          CORTEX_USE_SUBAGENTS: ${{ secrets.CORTEX_USE_SUBAGENTS }}
          X_PLAYWRIGHT_SESSION: ${{ secrets.X_PLAYWRIGHT_SESSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          LANGCHAIN_TRACING_V2: 'true'
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          LANGCHAIN_PROJECT: nands-sns-pipeline
