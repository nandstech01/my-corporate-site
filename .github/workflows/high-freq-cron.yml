name: High Frequency Cron Jobs

on:
  schedule:
    - cron: '0 4 * * *'                    # JST 13:00 Anthropic tweet reactor (1日1回・15分毎から絞り込み)
    - cron: '30 3,9 * * *'                # JST 12:30,18:30 X proactive discussion (1日2回・絞り込み)
    - cron: '0 5 * * *'                     # JST 14:00 viral AI repost (1日1回・絞り込み)
    - cron: '30 5 * * *'                   # JST 14:30 viral Threads repost (1日1回・絞り込み)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - anthropic-tweet-reactor
          - x-proactive-discussion
          - viral-ai-repost
          - viral-threads-repost

jobs:
  run:
    # Mac self-hosted: subscription claude -p + Playwright posting.
    # High-frequency cron (15min interval) — runner must be online 24/7.
    # Roll back: change to `ubuntu-latest` and add ANTHROPIC_API_KEY to Secrets.
    runs-on: [self-hosted, macOS, ARM64, nands-cortex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium (for X scraping)
        run: npx playwright install chromium --with-deps
      - run: npx tsx scripts/slack-bot-cron.ts
        env:
          CRON_JOB: ${{ github.event.inputs.job || 'auto' }}
          CRON_SCHEDULE: ${{ github.event.schedule || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_ALLOWED_USER_IDS: ${{ secrets.SLACK_ALLOWED_USER_IDS }}
          SLACK_DEFAULT_CHANNEL: ${{ secrets.SLACK_DEFAULT_CHANNEL }}
          SLACK_GENERAL_CHANNEL_ID: ${{ secrets.SLACK_GENERAL_CHANNEL_ID }}
          AI_JUDGE_ENABLED: ${{ secrets.AI_JUDGE_ENABLED }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          X_PLAYWRIGHT_SESSION: ${{ secrets.X_PLAYWRIGHT_SESSION }}
          TWITTER_USE_PLAYWRIGHT: ${{ secrets.TWITTER_USE_PLAYWRIGHT }}
          TYPEFULLY_ENABLED: ${{ secrets.TYPEFULLY_ENABLED }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
          CORTEX_USE_SUBAGENTS: ${{ secrets.CORTEX_USE_SUBAGENTS }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN_EXPIRES_AT: ${{ secrets.THREADS_TOKEN_EXPIRES_AT }}
          THREADS_POSTING_ENABLED: ${{ secrets.THREADS_POSTING_ENABLED }}
          LANGCHAIN_TRACING_V2: 'true'
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          LANGCHAIN_PROJECT: nands-sns-pipeline
